name: Deploy

# Deploys every app to Cloudflare Workers on every push to main.
#
# Database migrations are NOT run here. The Supabase GitHub integration (Project Settings →
# Integrations → GitHub, "Deploy to production" on, "Automatic branching" off) applies new
# files in supabase/migrations when main changes and reports a check on the commit. The
# `wait-for-supabase` job below holds the Workers deploy until that check passes, so the API
# never goes live ahead of the schema it needs. See .claude/skills/scaffold/SKILL.md §8.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     — Workers Scripts:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_API_URL   (web build-time)
#   PUBLIC_SITE_URL, PUBLIC_APP_URL                            (site build-time, if apps/site exists)
# Repository variable (not secret): WEB_URL — production web URL, used by the smoke job.
# The scaffold skill removes jobs for apps that were not generated.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  wait-for-supabase:
    name: Wait for Supabase migrations
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      # Polls this commit for the Supabase integration's result (check run or commit status,
      # whichever it reports). Passes straight through if the commit reports nothing from
      # Supabase within ~2 minutes (no migration changes). Scaffold confirms the check's real
      # name after the first push and tightens the filter if needed.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          seen=0
          for i in $(seq 1 60); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select((.app.slug // "" | ascii_downcase | contains("supabase")) or (.name | ascii_downcase | contains("supabase")))]')
            stats=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context | ascii_downcase | contains("supabase"))]')
            count=$(( $(echo "$runs" | jq length) + $(echo "$stats" | jq length) ))
            if [ "$count" -gt 0 ]; then
              seen=1
              pending=$(( $(echo "$runs" | jq '[.[] | select(.status != "completed")] | length') + $(echo "$stats" | jq '[.[] | select(.state == "pending")] | length') ))
              failed=$(( $(echo "$runs" | jq '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not))] | length') + $(echo "$stats" | jq '[.[] | select(.state == "failure" or .state == "error")] | length') ))
              if [ "$failed" -gt 0 ]; then echo "Supabase deployment failed — not deploying Workers."; exit 1; fi
              if [ "$pending" -eq 0 ]; then echo "Supabase deployment succeeded."; exit 0; fi
            elif [ "$i" -ge 12 ]; then
              echo "No Supabase check on this commit after 2 minutes — assuming no database changes."; exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Supabase (seen=$seen)."; exit 1

  # Fallback only — use instead of the integration if it can't be connected (record why in an ADR).
  # Needs secrets SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, and
  # `needs: migrate` on the build job in place of wait-for-supabase.
  # migrate:
  #   name: Supabase migrations (CLI fallback)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: supabase/setup-cli@v1
  #     - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" && supabase db push
  #       env:
  #         SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  #         SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  #         SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  build:
    name: Build all apps
    runs-on: ubuntu-latest
    needs: wait-for-supabase
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            apps/*/dist
            apps/api/src
          retention-days: 1

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    needs: [build, deploy-api]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: apps
      - run: pnpm --filter web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-site:
    name: Deploy site
    # scaffold skill deletes this job if apps/site was not generated
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: apps
      - run: pnpm --filter site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Production smoke check
    # Read-only checks that the deploy is actually serving. The release skill's post-deploy check
    # (.claude/skills/release/SKILL.md §3–4) goes further: headers, error logs, the owner clicking through.
    # Set the repository variable WEB_URL (Settings → Secrets and variables → Actions → Variables)
    # to the web app's production URL; it isn't secret.
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    steps:
      - env:
          API_URL: ${{ secrets.VITE_API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$API_URL/health" && break
            [ "$i" -eq 6 ] && { echo "API /health failing after deploy"; exit 1; }
            sleep 10
          done
          if [ -n "$WEB_URL" ]; then
            curl -fsS -o /dev/null "$WEB_URL/" || { echo "Web app not serving"; exit 1; }
            entry=$(curl -fsS "$WEB_URL/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
            [ -n "$entry" ] || { echo "No entry script found in index.html"; exit 1; }
            curl -fsSI "$WEB_URL/$entry" | grep -qi 'content-type: .*javascript' || { echo "$entry is not served as JavaScript (SPA fallback?)"; exit 1; }
          else
            echo "WEB_URL not set — skipping web checks"
          fi

  # Mobile is NOT deployed from here. EAS Build/Submit/Update run from the developer's
  # machine or via `eas` in a separate workflow that the scaffold skill adds only when
  # apps/mobile exists — see .claude/skills/scaffold/SKILL.md → mobile.
